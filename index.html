<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HE Data Analyst Portfolio</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
    <header>
        <div class="header-content">
        <nav>
            <ul>
                <li><a href="#about" class="active" data-translate-key="aboutNavLink">About me</a></li>
                <li><a href="#skills" data-translate-key="skillsNavLink">Skills</a></li>
                <li><a href="#projects" data-translate-key="projectsNavLink">Portfolio</a></li> <!-- Changed to Portfolio as in your screenshot -->
                <li><a href="#contact" data-translate-key="contactNavLink">Contact</a></li>
            </ul>
        </nav>
            <div class="mobile-header-controls">
                <button class="hamburger-menu" id="mobileMenuToggle">
                    <span></span>
                    <span></span>
                    <span></span>
                </button>
                <div class="language-switcher">
                    <div class="flag-container">
                        <img src="https://cdn.countryflags.com/thumbs/united-kingdom/flag-400.png" alt="English" class="flag-icon" id="selectedFlag" >
                        <img src="https://cdn.countryflags.com/thumbs/france/flag-400.png" alt="Français" class="flag-icon alternative-flag" onclick="switchLanguage()">
                    </div>
                </div>
            </div>
            <div class="language-switcher desktop-language-switcher">
                <div class="flag-container">
                    <img src="https://cdn.countryflags.com/thumbs/united-kingdom/flag-400.png" alt="English" class="flag-icon" id="selectedFlagDesktop" >
                    <img src="https://cdn.countryflags.com/thumbs/france/flag-400.png" alt="Français" class="flag-icon alternative-flag" onclick="switchLanguage()">
                </div>
            </div>
            <div class="mobile-nav" id="mobileNav">
                <ul>
                    <li><a href="#about" class="active" data-translate-key="aboutNavLink">About me</a></li>
                    <li><a href="#skills" data-translate-key="skillsNavLink">Skills</a></li>
                    <li><a href="#projects" data-translate-key="projectsNavLink">Portfolio</a></li>
                    <li><a href="#contact" data-translate-key="contactNavLink">Contact</a></li>
                </ul>
            </div>
        </div>
    </header>
    <main>
        <section id="about">
            <h2 data-translate-key="aboutMeTitle">About Me</h2>
            <div class="about-content">
                <div class="about-text" id="aboutTextContainer">
                    <!-- Paragraphs will be dynamically inserted here by JS -->
                </div>
                <div class="about-photo">
                    <img src="images/your-photo.png" alt="Your professional headshot or profile picture">
                </div>
            </div>
            <div class="resume-section">
                <p class="resume-description" data-translate-key="resumeDescription">
                    For a detailed overview of my experience and qualifications, you can download my resume below.
                </p>
                <a href="#" id="resumeLink" class="resume-button" data-translate-key="downloadResume" target="_blank">
                    <i class="fas fa-download"></i>
                    <span>Download Resume</span>
                </a>
            </div>
        </section>
        <section id="skills">
            <h2 data-translate-key="skillsTitle">My Skills</h2>
            <div class="skills-container" id="skillsContainer">
                <!-- Skills will be dynamically inserted here by JavaScript -->
            </div>
        </section>
        <section id="projects">
            <h2>My Projects</h2>
            <div class="projects-container" id="projectsContainer">
                <!-- Project cards will be inserted here by JavaScript -->
            </div>
        </section>
        <!-- Modal for Project Details -->
        <div id="projectModal" class="modal">
            <div class="modal-content">
                <div class="modal-header">
                    <h2 id="modalProjectTitle"></h2>
                    <span class="close">&times;</span>
                </div>
                <div class="modal-body">
                    <div id="modalProjectDetails">
                        <!-- Project details will be loaded here -->
                    </div>
                </div>
            </div>
        </div>
    </main>
    <footer id="contact">
        <h2 data-translate-key="contactTitle"></h2>
        <div class="social-buttons"> <!-- Added an ID for potential future use if needed, but the class is key -->
            <a href="https://linkedin.com/in/helhadrachi" class="social-button linkedin" aria-label="LinkedIn" target="_blank">
                <i class="fab fa-linkedin-in"></i>
            </a>
            <a href="https://github.com/ehicham95" class="social-button github" aria-label="GitHub" target="_blank">
                <i class="fab fa-github"></i>
            </a>
            <a href="https://twitter.com/hehadrachi" class="social-button twitter" aria-label="Twitter" target="_blank">
                <i class="fab fa-twitter"></i>
            </a>
            <a href="mailto:hicham.elhadrachi@gmail.com" class="social-button gmail" aria-label="Gmail" target="_blank">
                <i class="fab fa-google"></i>
            </a>
        </div>
        <!-- <p>© 2023 My Portfolio</p> -->
    </footer>
    <script src="script.js"></script>
</body>
</html>
