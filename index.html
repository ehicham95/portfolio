<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HE Data Analyst Portfolio</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
    <header>
        <div class="header-content">
        <nav>
            <ul>
                <li><a href="#about" class="active" data-translate-key="aboutNavLink">About me</a></li>
                <li><a href="#projects" data-translate-key="projectsNavLink">Portfolio</a></li> <!-- Changed to Portfolio as in your screenshot -->
                <li><a href="#contact" data-translate-key="contactNavLink">Contact</a></li>
            </ul>
        </nav>
            <div class="language-switcher">
                <div class="flag-container">
                    <img src="https://cdn.countryflags.com/thumbs/united-kingdom/flag-400.png" alt="English" class="flag-icon" id="selectedFlag" >
                    <img src="https://cdn.countryflags.com/thumbs/france/flag-400.png" alt="Français" class="flag-icon alternative-flag" onclick="switchLanguage()">
                </div>
            </div>
        </div>
    </header>
    <main>
        <section id="about">
            <h2 data-translate-key="aboutMeTitle">About Me</h2>
            <div class="about-content">
                <div class="about-text" id="aboutTextContainer">
                    <!-- Paragraphs will be dynamically inserted here by JS -->
                </div>
                <div class="about-photo">
                    <img src="your-photo.jpg" alt="Your professional headshot or profile picture">
                </div>
            </div>
        </section>
        <section id="projects">
            <h2>My Projects</h2>
            <div class="projects-container" id="projectsContainer">
                <!-- Project cards will be inserted here by JavaScript -->
            </div>
        </section>
    </main>
    <footer id="contact">
        <div class="social-buttons"> <!-- Added an ID for potential future use if needed, but the class is key -->
            <a href="https://linkedin.com/in/yourprofile" class="social-button linkedin" aria-label="LinkedIn">
                <i class="fab fa-linkedin-in"></i>
            </a>
            <a href="https://github.com/yourprofile" class="social-button github" aria-label="GitHub">
                <i class="fab fa-github"></i>
            </a>
            <a href="https://twitter.com/yourprofile" class="social-button twitter" aria-label="Twitter">
                <i class="fab fa-twitter"></i>
            </a>
            <a href="mailto:hicham.elhadrachi@gmail.com" class="social-button gmail" aria-label="Gmail">
                <i class="fab fa-google"></i>
            </a>
        </div>
        <!-- <p>© 2023 My Portfolio</p> -->
    </footer>
    <script src="script.js"></script>
</body>
</html>
